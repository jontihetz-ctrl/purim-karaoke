# Nginx reverse proxy config for purim-karaoke
# Place at: /etc/nginx/sites-available/karaoke
# Then: ln -s /etc/nginx/sites-available/karaoke /etc/nginx/sites-enabled/karaoke

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # WebSocket support (required for socket.io)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
